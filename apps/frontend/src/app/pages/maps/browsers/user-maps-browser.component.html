<div class="grid grid-cols-1 gap-4 lg:grid-flow-col lg:grid-cols-[minmax(auto,14rem)_1fr] lg:grid-rows-[auto_auto]">
  <p class="card-title text-nowrap text-40 md:text-48">Your Maps</p>
  <div class="flex flex-col gap-4">
    @if (hasSubmissionBan) {
      <p>You are banned from map submission</p>
    } @else {
      <m-card title="Map Summary">
        @if (summaryLoading || summary?.length > 0) {
          <div class="flex flex-col gap-1" [mSpinner]="summaryLoading">
            @for (item of summary; track item.status) {
              <p class="text-gray-300">{{ MapStatusName.get(item.status) }}</p>
              <p class="mb-1 text-gray-50">{{ item.statusCount }}</p>
            }
          </div>
        } @else {
          <p>No maps submitted</p>
        }
      </m-card>
      <button class="btn btn-blue" type="button" routerLink="/map-edit/submit">Submit a Map</button>
    }
  </div>

  <div class="flex items-end lg:self-end">
    <form class="flex w-full flex-col gap-2 lg:ml-auto lg:w-auto" [formGroup]="filters">
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2 md:flex-wrap-reverse md:justify-end">
        <input
          class="textinput order-1 min-w-0 flex-1 backdrop-blur-lg md:order-none md:w-64 md:flex-none"
          type="text"
          placeholder="Map Name"
          formControlName="name"
        />
        <div class="order-3 flex w-full items-center gap-2 md:order-none md:w-auto">
          <m-user-select class="min-w-0 flex-1 md:flex-none" formControlName="credit" />
          <m-dropdown
            class="shrink-0"
            [entries]="MapCreditOptions"
            [nameFn]="MapCreditNameFn"
            formControlName="creditType"
            mTooltip="Searching for yourself requires inputting your profile in the user searchbox"
            tooltipPosition="top"
          />
        </div>
        <button (click)="filters.reset({ status: [] })" type="button" class="btn order-2 size-10 p-0 md:order-none md:size-8">
          <m-icon icon="filter-remove" class="size-5" />
        </button>
      </div>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2 md:flex-wrap-reverse md:justify-end">
        <div class="flex w-full items-center gap-2 md:w-auto">
          <p class="font-display text-24">Status</p>
          <p-multiSelect
            class="min-w-0 flex-1 md:flex-none"
            formControlName="status"
            [options]="StatusDropdown"
            optionLabel="label"
            optionValue="type"
            [showHeader]="false"
            scrollHeight="auto"
            appendTo="body"
          />
        </div>
        <m-dropdown class="max-md:ml-auto" [entries]="MapSortOptions" [nameFn]="MapSortNameFn" formControlName="sortType" />
      </div>
    </form>
  </div>
  <m-map-list [maps]="maps" [loadMore]="loadMore" [loading]="loading" [isSubmissionPage]="true" />
</div>
