<div class="flex flex-wrap">
  <m-card title="Blog Posts" class="pr-8 lg:basis-3/4">
    @for (blogPost of feed.item.slice(0, POSTS_DISPLAYED); track blogPost) {
      <a [href]="blogPost.link" target="_blank" rel="noopener noreferrer" class="blog-post">
        <div class="flex flex-wrap items-end">
          <h2 class="relative max-w-full flex-1 flex-grow px-4">{{ blogPost.title }}</h2>
          <h5 class="pubDate col-auto ml-auto hidden sm:block">
            {{ blogPost.pubDate }}
          </h5>
        </div>
        <p class="post-separator pb-3">
          <span class="md-override mr-2" [innerHTML]="blogPost['content:encoded']"></span>
          <span class="whitespace-nowrap underline">Read More</span>
        </p>
      </a>
    }
    @if (loaded) {
      <h3 class="mt-3 text-center">
        <a href="https://blog.momentum-mod.org" target="_blank">Read more official posts here!</a>
      </h3>
    }
    @if (!loaded) {
      <h3 class="mt-3 text-center">Waiting for API response</h3>
    }
  </m-card>
  <iframe
    class="lg:basis-1/4"
    src="https://discordapp.com/widget?id=235111289435717633&theme=dark"
    width="100%"
    height="500"
    allowtransparency="true"
  ></iframe>
</div>
