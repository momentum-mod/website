<m-card title="Utilities">
  <div class="flex flex-col gap-8">
    <form (ngSubmit)="createUser()" [formGroup]="userForm">
      <h4>Create Placeholder User</h4>
      <input class="my-2 textinput" type="text" formControlName="alias" />
      <button class="btn btn-blue" type="submit" [disabled]="aliasInvalid()">Submit</button>
    </form>

    <form (ngSubmit)="makeAnnouncement()" [formGroup]="announcementForm">
      <h4>Send an Announcement to All Users</h4>
      <div class="my-2 flex flex-col">
        <textarea
          class="w-96 max-w-full resize-none overflow-hidden textinput"
          placeholder="Announcement message..."
          rows="1"
          mDynamicTextareaHeight
          formControlName="message"
        ></textarea>
        @if (messageLength() > 0) {
          <span class="mt-1 ml-2 text-sm">{{ MAX_ADMIN_ANNOUNCEMENT_LENGTH - messageLength() | plural: 'character' }} remaining</span>
        }
      </div>
      <button class="btn btn-blue" type="submit" [disabled]="messageInvalid()">Submit</button>
    </form>

    <form (ngSubmit)="showKillswitchesVerifyDialog()" [formGroup]="killswitchForm">
      <h4>Killswiches</h4>
      <ul class="list-unstyled my-2 whitespace-nowrap">
        @for (type of KillswitchTypes; track type) {
          <li><input type="checkbox" class="checkbox mr-1" [formControlName]="type" />{{ type }}</li>
        }
      </ul>
      <button class="btn btn-blue" type="submit">Submit</button>
    </form>
  </div>
</m-card>
