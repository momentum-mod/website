<m-card [title]="'Report Queue'" cardClass="!p-0">
  <ng-container header>
    <label>Resolved: </label>
    <select name="Resolved" (change)="filterChange.next()" [(ngModel)]="filters.resolved">
      <option value="true">Yes</option>
      <option selected="selected" value="false">No</option>
    </select>
  </ng-container>
  <div
    class="flex divide-x divide-white divide-opacity-10 border-b border-white border-opacity-10 bg-black bg-opacity-20 font-bold uppercase tracking-wide text-gray-300"
  >
    <div class="w-[9%] px-2 py-1">Date</div>
    <div class="w-[9%] px-2 py-1">Type</div>
    <div class="w-[9%] px-2 py-1">Category</div>
    <div class="w-[13%] px-2 py-1">Submitter</div>
    <div class="w-[13%] px-2 py-1">Resolver</div>
    <div class="w-[19%] px-2 py-1 text-center">Report Message</div>
    <div class="w-[19%] px-2 py-1 text-center">Resolution Message</div>
    <div class="w-[9%] px-2 py-1 text-center">Actions</div>
  </div>
  <ul [mSpinner]="loading" class="divide-y divide-white divide-opacity-10">
    @for (report of reportQueue; track $index) {
      <li class="basis-full">
        <m-queued-report [report]="report" (reportUpdate)="refresh.next()" />
      </li>
    } @empty {
      @if (!loading) {
        <i class="block px-2 py-1">There are no reports that match the search criteria.</i>
      }
    }
  </ul>
  <p-paginator
    class="block border-t border-white border-opacity-10 px-3 py-2"
    (onPageChange)="pageChange.next($event)"
    [first]="first"
    [rows]="rows"
    [totalRecords]="totalRecords"
    [showCurrentPageReport]="true"
    [alwaysShow]="false"
  />
</m-card>
