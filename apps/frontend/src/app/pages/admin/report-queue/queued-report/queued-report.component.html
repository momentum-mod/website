<div class="flex divide-x divide-white divide-opacity-10">
  <div class="w-[6%] px-2 py-1 text-left">{{ report.id }}</div>
  <div class="w-[12%] px-2 py-1 text-left">{{ typeText }}</div>
  <div class="w-[9%] px-2 py-1 text-left">{{ categoryText }}</div>
  <div class="w-[13%] px-2 py-1 text-left">
    @if (report.submitter) {
      <a [routerLink]="'/profile/' + report.submitter.id" class="flex items-center gap-2">
        <m-avatar class="h-6" [url]="report.submitter.avatarURL" />
        <p>{{ report.submitter.alias }}</p>
      </a>
    }
  </div>
  <div class="w-[13%] px-2 py-1 text-left">
    @if (report.resolver) {
      <a [routerLink]="'/profile/' + report.resolver.id" class="flex items-center gap-2">
        <m-avatar class="h-6" [url]="report.resolver.avatarURL" />
        <p>{{ report.resolver.alias }}</p>
      </a>
    }
  </div>
  <div class="w-[19%] px-2 py-1">
    <textarea
      readonly
      rows="2"
      class="textinput scroll-thin w-full resize-none overflow-y-auto text-sm"
      [value]="report.message"
    ></textarea>
  </div>
  <div class="w-[19%] px-2 py-1">
    <textarea
      readonly
      rows="2"
      class="textinput scroll-thin w-full resize-none overflow-y-auto text-sm"
      [value]="report.resolutionMessage ?? ''"
    ></textarea>
  </div>
  <div class="flex w-[9%] items-center justify-center gap-2 px-2 py-1">
    <button type="button" class="btn btn-blue aspect-square p-2" mTooltip="Update Report" (click)="update()">
      <m-icon icon="pencil" />
    </button>
    <a [routerLink]="reportedResourceURL" target="_blank" class="btn aspect-square p-2" mTooltip="View Reported Resource">
      <m-icon icon="eye" />
    </a>
  </div>
</div>
