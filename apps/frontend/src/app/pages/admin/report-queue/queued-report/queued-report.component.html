<!-- A table row from lg up. Below that each report is a block of labelled fields. -->
<div
  class="flex flex-col gap-1 p-3 lg:flex-row lg:divide-x lg:divide-white lg:divide-opacity-10 lg:p-0"
>
  <div class="text-left lg:w-[6%] lg:px-2 lg:py-1"><span class="mr-2 text-sm text-gray-300 lg:hidden">ID</span>{{ report.id }}</div>
  <div class="text-left lg:w-[12%] lg:px-2 lg:py-1"><span class="mr-2 text-sm text-gray-300 lg:hidden">Type</span>{{ typeText }}</div>
  <div class="text-left lg:w-[13%] lg:px-2 lg:py-1"><span class="mr-2 text-sm text-gray-300 lg:hidden">Category</span>{{ categoryText }}</div>
  <div class="flex items-center gap-2 text-left lg:block lg:w-[13%] lg:px-2 lg:py-1">
    <span class="text-sm text-gray-300 lg:hidden">Submitter</span>
    @if (report.submitter) {
      <a [routerLink]="'/profile/' + report.submitter.id" class="flex items-center gap-2">
        <m-avatar class="h-6" [url]="report.submitter.avatarURL" />
        <p>{{ report.submitter.alias }}</p>
      </a>
    }
  </div>
  <div class="flex items-center gap-2 text-left lg:block lg:w-[13%] lg:px-2 lg:py-1">
    <span class="text-sm text-gray-300 lg:hidden">Resolver</span>
    @if (report.resolver) {
      <a [routerLink]="'/profile/' + report.resolver.id" class="flex items-center gap-2">
        <m-avatar class="h-6" [url]="report.resolver.avatarURL" />
        <p>{{ report.resolver.alias }}</p>
      </a>
    }
  </div>
  <div class="[overflow-wrap:anywhere] lg:w-[13%] lg:px-2 lg:py-1 lg:text-center">
    <span class="mr-2 text-sm text-gray-300 lg:hidden">Message</span>{{ report.message }}
  </div>
  <div class="[overflow-wrap:anywhere] lg:w-[13%] lg:px-2 lg:py-1 lg:text-center">
    <span class="mr-2 text-sm text-gray-300 lg:hidden">Resolution Message</span>{{ report.resolutionMessage }}
  </div>
  <div class="mt-1 flex flex-wrap gap-2 lg:mt-0 lg:w-[17%] lg:flex-col lg:flex-nowrap lg:items-center lg:gap-1 lg:px-2 lg:py-1">
    <button type="button" class="btn btn-blue" (click)="update()">Update</button>
    <a [routerLink]="reportedResourceURL" target="_blank" class="btn">View Reported Resource</a>
  </div>
</div>
