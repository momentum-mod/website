@let d = display();
<div class="flex min-h-[50px] flex-wrap items-center gap-1 py-1" [ngClass]="{ 'w-56': dateNone() }">
  <a routerLink="/profile/{{ activity().user.id }}" class="contents">
    <m-avatar [url]="activity().user.avatarURL" class="mr-2 h-7!" />
    <p>{{ activity().user.alias }}</p>
  </a>
  <p>{{ d.actionText }}</p>
  <p [ngStyle]="{ cursor: d.link ? 'pointer' : 'auto' }" [routerLink]="d.link ? d.link : null">
    <b [ngClass]="'text-' + d.color">{{ d.eventText }}</b
    >!
  </p>
  <m-icon class="text-3xl" [ngStyle]="{ color: d.color }" [icon]="d.icon" />
  <p class="ml-auto" [ngClass]="dateNone() ? 'd-none' : ''">{{ activity().createdAt | timeAgo }}</p>
</div>
