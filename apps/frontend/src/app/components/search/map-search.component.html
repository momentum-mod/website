<input
  class="mb-2 w-full grow textinput"
  [mSpinner]="searchStatus() === 'PENDING'"
  [placeholder]="'Search by map name...'"
  [formControl]="search"
  (keydown)="onKeydown($event)"
  type="text"
/>
@if (searchStatus() === 'INVALID' && searchValue().length > 0 && found().length === 0) {
  <p class="p-3 text-lg text-gray-200">
    {{ getFirstError() }}
  </p>
}
@for (map of found(); track map) {
  <div
    class="flex items-center gap-4 rounded-sm p-2 transition-colors"
    [ngClass]="$index === selectedIdx() ? 'bg-white/5' : 'bg-white/0'"
    (mouseenter)="selectedIdx.set($index)"
    (click)="onSelected(map)"
  >
    <img class="aspect-video h-12" [src]="map.thumbnail.small" />
    <p class="mr-1 text-lg font-bold">{{ map.name }}</p>
  </div>
}
<p-paginator
  (onPageChange)="pageChange.next($event)"
  [first]="first()"
  [rows]="rows"
  [totalRecords]="totalRecords()"
  [showCurrentPageReport]="true"
  [alwaysShow]="false"
/>
