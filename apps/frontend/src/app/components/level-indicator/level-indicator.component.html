<div
  [ngStyle]="{ 'background-color': levelColor() }"
  [ngClass]="[textColor(), prestige() ? 'pl-1' : 'pl-2']"
  class="flex items-center gap-1 rounded-sm pr-2 font-display shadow-sm"
  [mTooltip]="'Prestige ' + prestige() + ' - Level ' + level()"
>
  <!-- Display prestige icon if available -->
  @if (prestige()) {
    <img [ngClass]="imageClass()" class="h-5 w-5 drop-shadow-xs" [src]="prestigeIcon()" alt="Prestige Icon" />
  }

  <!-- Display the level -->
  <b class="pointer-events-none text-xl drop-shadow-xs">{{ level() }}</b>
</div>
