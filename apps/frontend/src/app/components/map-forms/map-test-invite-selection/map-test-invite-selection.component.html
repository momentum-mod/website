<div
  class="flex h-full max-h-144 min-h-64 w-full flex-col gap-4 transition-opacity lg:flex-row"
  [ngClass]="{
    'pointer-events-none opacity-25': disabled()
  }"
>
  <div class="lg:w-1/2">
    <m-user-search #searchInput (selected)="addUser($event, searchInput)" mTooltip tooltipEvent="noop" />
  </div>
  <div class="flex min-h-40 flex-col overflow-y-auto rounded-sm bg-black/25 py-2 lg:w-1/2">
    @for (user of users(); track user) {
      <div class="flex items-center bg-white/0 p-2 px-4 transition-colors hover:bg-white/5">
        <m-user [user]="user" aliasClass="text-base ml-1" />
        <button type="button" class="btn ml-auto py-1 btn-red" (click)="removeUser(user.id)">Delete</button>
      </div>
    }
    <p class="mt-auto mr-3 self-end text-sm text-gray-200 italic">
      {{ users().length }} /
      {{ MAX_TESTING_REQUESTS.toString() }}
      invites used
    </p>
  </div>
</div>
