<div class="flex flex-col gap-4 lg:flex-row lg:gap-0">
  <m-multi-file-upload
    class="flex h-auto w-full shrink-0 flex-col lg:mr-4 lg:w-56"
    icon="image-multiple-outline"
    [formControl]="formControlPassthrough()"
    typeName="image"
    [showSelected]="false"
    acceptExtensions=".png"
    [enableClipboard]="true"
    [max]="5"
  />
  <div class="flex grow flex-col gap-4 lg:flex-row">
    <div class="lg:w-1/3">
      <p class="mb-1 ml-1 text-lg">
        Thumbnail
        <m-icon icon="asterisk" class="mb-1 h-5 w-5 align-middle" mTooltip="Required" />
      </p>
      <!-- We want to keep setting the width and height of this container based on 1/3 width and 16/9
        aspect ratio at all times, so we use a hacky 1/1 grid to stack each item, so an item being
        dragged over existing thumbnail gets plonked on top of it.  -->
      <div
        class="grid aspect-video w-full place-items-center inputlike bg-black/25 [grid-template:1fr/1fr] *:col-[1/1] *:row-[1/1] hover:bg-black/25! [&>.cdk-drag-placeholder]:z-2 [&>.cdk-drag-placeholder]:opacity-100"
        cdkDropList
        cdkDropListOrientation="horizontal"
        #thumbnailList="cdkDropList"
        [cdkDropListData]="items()[ImageSelectionType.THUMBNAIL]"
        [cdkDropListConnectedTo]="[extrasList]"
        (cdkDropListDropped)="drop($event, ImageSelectionType.THUMBNAIL)"
      >
        @for (item of items()[ImageSelectionType.THUMBNAIL]; track item) {
          <div
            cdkDrag
            class="group relative cursor-move rounded-sm shadow-sm transition-opacity [transition-property:filter] hover:contrast-75 [&.cdk-drag-preview]:opacity-75 [&.cdk-drag-preview]:contrast-75"
          >
            <img class="aspect-video w-full" [src]="item.dataUrl" />
            <m-icon
              icon="close"
              (click)="removeItem(item, ImageSelectionType.THUMBNAIL)"
              class="absolute top-0 right-0 mt-2 mr-2 h-6 w-6 rounded-sm bg-gray-900/50 transition-colors hover:bg-gray-900/70"
            />
          </div>
        }
      </div>
    </div>
    <div class="flex h-full flex-col lg:w-2/3">
      <p class="pointer-events-none mb-1 text-lg">Extras</p>
      <!-- Using grid on this container goes wonky when you have 5 images selected and drag thumbnail into extra, besides that works okay and I can't bear working on styling for this any longer! -->
      <div
        cdkDropList
        cdkDropListOrientation="horizontal"
        #extrasList="cdkDropList"
        [cdkDropListData]="items()[ImageSelectionType.EXTRA]"
        [cdkDropListConnectedTo]="[thumbnailList]"
        (cdkDropListDropped)="drop($event, ImageSelectionType.EXTRA)"
        class="grid h-full grid-cols-2 gap-2 inputlike rounded-sm bg-black/25 hover:bg-black/25! max-sm:min-h-24 sm:grid-cols-4 [&>.cdk-drag-placeholder]:opacity-0"
      >
        @for (item of items()[ImageSelectionType.EXTRA]; track item) {
          <div
            cdkDrag
            class="group relative aspect-video cursor-move shadow-sm transition-opacity [transition-property:filter] hover:contrast-75 [&.cdk-drag-preview]:opacity-75 [&.cdk-drag-preview]:contrast-75"
          >
            <img class="aspect-video w-full" [src]="item.dataUrl" />
            <m-icon
              icon="cursor-move"
              class="[>.cdk-drag-preview>&]-hover:opacity-30 absolute top-1/2 left-1/2 h-16 w-16 transform-[translateX(-50%)_translateY(-50%)] text-white opacity-0 transition-opacity group-hover:opacity-30 [.cdk-drag-preview>&]:opacity-30"
            />
            <m-icon
              icon="close"
              (click)="removeItem(item, ImageSelectionType.EXTRA)"
              class="absolute top-0 right-0 mt-2 mr-2 h-6 w-6 rounded-sm bg-gray-900/50 transition-colors hover:bg-gray-900/70"
            />
          </div>
        }
      </div>
    </div>
  </div>
</div>
