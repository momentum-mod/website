name: Code Quality
on:
  pull_request:
    branches:
      - main
env:
  # Pinned exactly so every job uses the same Node.js version.
  NODE_VERSION: 24.22.1
jobs:
  install-deps:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Original node_modules Cache
        uses: actions/cache@v5
        id: original_cache
        with:
          path: node_modules
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: node_modules Cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: modules-${{ github.run_id }}

      - name: Prisma Cache
        uses: actions/cache@v5
        with:
          path: libs/db/src/generated
          key: prisma-${{ github.run_id }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: npm install
        if: steps.original_cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: prisma generate
        run: npx nx run db:generate

  lint:
    name: Linting and Formatting
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          submodules: 'true'

      - uses: actions/cache@v5
        with:
          path: node_modules
          key: modules-${{ github.run_id }}

      - name: Prisma Cache
        uses: actions/cache@v5
        with:
          path: libs/db/src/generated
          key: prisma-${{ github.run_id }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Prettier
        run: npx nx format:check --base=origin/main

      - name: Lint Affected
        run: npx nx affected
          --target=lint
          --base=${{ github.event.pull_request.base.sha }}
          --head=${{ github.event.pull_request.head.sha }}
          --parallel=3

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          submodules: 'true'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: modules-${{ github.run_id }}

      - name: Prisma Cache
        uses: actions/cache@v5
        with:
          path: libs/db/src/generated
          key: prisma-${{ github.run_id }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Test Affected
        run: npx nx affected
          --target=test
          --base=${{ github.event.pull_request.base.sha }}
          --head=${{ github.event.pull_request.head.sha }}
          --parallel=3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          submodules: 'true'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: modules-${{ github.run_id }}

      - name: Prisma Cache
        uses: actions/cache@v5
        with:
          path: libs/db/src/generated
          key: prisma-${{ github.run_id }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build Affected
        run: npx nx affected
            --target=build
            --base=${{ github.event.pull_request.base.sha }}
            --head=${{ github.event.pull_request.head.sha }}
            --parallel=3

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: modules-${{ github.run_id }}

      - name: Prisma Cache
        uses: actions/cache@v5
        with:
          path: libs/db/src/generated
          key: prisma-${{ github.run_id }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Check affected
        run:
          |
          if npx nx show projects \
            --affected \
            --base=${{ github.event.pull_request.base.sha }} \
            --head=${{ github.event.pull_request.head.sha }} |
            grep -q backend-e2e
          then
            echo "affected=true" >> $GITHUB_ENV
          else
            echo "affected=false" >> $GITHUB_ENV
          fi

      - name: Start Valkey and RustFS
        if: env.affected == 'true'
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: momentum
          POSTGRES_PORT: 5432
          STORAGE_REGION: us-west-1
          STORAGE_BUCKET_NAME: momtest
          RUSTFS_SERVER_PORT: 9000
          RUSTFS_CONSOLE_PORT: 9001
          RUSTFS_ACCESS_KEY: rustfs
          RUSTFS_SECRET_KEY: rustfs123
          VALKEY_PORT: 6379
        run: |
          printf 'RUSTFS_ACCESS_KEY=%s\nRUSTFS_SECRET_KEY=%s\n' \
            "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" > .env
          docker compose up -d --wait valkey rustfs

      - name: Run tests
        if: env.affected == 'true'
        env:
          NODE_ENV: test
          NEST_PORT: 3003
          BACKEND_URL: http://localhost:3000
          FRONTEND_URL: http://localhost:4200
          CDN_URL: http://localhost:9000/momtest
          DATABASE_URL: postgresql://unused:unused@localhost/unused
          STORAGE_REGION: us-west-1
          STORAGE_BUCKET_NAME: momtest
          STORAGE_ACCESS_KEY_ID: rustfs
          STORAGE_SECRET_ACCESS_KEY: rustfs123
          STORAGE_ENDPOINT_URL: http://localhost:9000
          VALKEY_PORT: 6379
          VALKEY_HOST: localhost
          STEAM_WEB_API_KEY: thisisenoughtogenerateanopenidreferralforsomereason
          SESSION_SECRET: thisisashitsecretdontuseitinprod
          JWT_SECRET: thisisalsonotasecure
          # Use every CPU available
          MOMENTUM_E2E_WORKERS: max
        run: npx nx run backend-e2e:e2e

  type-test:
    name: Type Tests
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          submodules: 'true'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: modules-${{ github.run_id }}

      - name: Prisma Cache
        uses: actions/cache@v5
        with:
          path: libs/db/src/generated
          key: prisma-${{ github.run_id }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Test Build @momentum/constants
        run: npx nx run constants:test-types
