# Shared by every service. There's no Postgres here: the E2E tests start their
# own in-memory database (PGlite), so DATABASE_URL below is never connected to;
# it's only there because the backend's config validation requires one.
x-env: &env
  NODE_ENV: test
  NEST_PORT: 3003
  BACKEND_URL: http://localhost:3000
  FRONTEND_URL: http://localhost:4200
  CDN_URL: http://rustfs:9000/momtest
  DATABASE_URL: postgresql://unused:unused@localhost/unused
  RUSTFS_REGION: us-west-1
  RUSTFS_ADDRESS: :9000
  RUSTFS_CONSOLE_ADDRESS: :9001
  RUSTFS_ACCESS_KEY: rustfs
  RUSTFS_SECRET_KEY: rustfs123
  STORAGE_REGION: us-west-1
  STORAGE_BUCKET_NAME: momtest
  STORAGE_ACCESS_KEY_ID: rustfs
  STORAGE_SECRET_ACCESS_KEY: rustfs123
  STORAGE_ENDPOINT_URL: http://rustfs:9000
  VALKEY_PORT: 6379
  VALKEY_HOST: valkey
  STEAM_WEB_API_KEY: thisisenoughtogenerateanopenidreferralforsomereason
  SESSION_SECRET: thisisashitsecretdontuseitinprod
  JWT_SECRET: thisisalsonotasecure

services:
  valkey:
    environment:
      <<: *env
      VALKEY_EXTRA_FLAGS: "--port 6379"
    ports:
      - "6379:6379"
    healthcheck:
      test: [
        "CMD-SHELL",
        "redis-cli ping | grep PONG"
      ]
      interval: 5s
      timeout: 10s
      retries: 3
  rustfs:
    environment:
      <<: *env
    ports:
      - "9000:9000"
      - "9001:9001"
    command: /data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 5s
      timeout: 20s
      retries: 3
  createbuckets:
    environment:
      <<: *env 
    entrypoint: >
     sh -c "
       rc alias set momentum http://rustfs:9000 rustfs rustfs123 &&
       rc bucket create momentum/momtest --ignore-existing &&
       rc bucket anonymous set public momentum/momtest
     "
  backend-e2e:
    # If we used `node-alpine` here we'd need to redownload our node_modules,
    # as some binaries are slightly different. About the same bandwidth for that
    # as to download the larger (Debian based) `node` image, and that's a bit
    # simpler.
    image: node:24.22.0
    depends_on:
      - valkey
      - rustfs
      - createbuckets
    environment:
      <<: *env
    working_dir: /app/
    volumes:
      - ./:/app/
    ports:
      - "3000:3000"
    command: >
      sh -c "
        npm install &&
        npx nx run backend-e2e:e2e
      "
